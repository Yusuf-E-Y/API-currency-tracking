<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="60">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="author" content="Yusuf Efe Yeşil">
    <meta name="description" content="Döviz sitesi">
    <title>Döviz Sitesi</title>
</head>
<body>

    <nav class="navbar">
    <ul class="currency-list">
        <li>
            <h3>USD</h3>
            <h5>{{dolar}}</h5>
        </li>
        <li>
            <h3>EUR</h3>
            <h5>{{euro}}</h5>
        </li>
        <li>
            <h3>CHF</h3>
            <h5>{{ chf }}</h5>
        </li>
        <li>
            <h3>GBP</h3>
            <h5>{{ gbp}}</h5>
        </li>
        <li>
            <h3>AUD</h3>
            <h5>{{ aud }}</h5>
        </li>
        <li>
            <h3>CAD</h3>
            <h5>{{ cad }}</h5>
        </li>
    </ul>
    </nav>


    <div class="Situation">
        <h2>Mevcut Gelir</h2>
        <p class="s1">170 Dolar ({{ dolar }}) + 240 Euro ({{ euro }}) = {{ situation }}</p>
    </div>

    <div class="graphs">
        <a href="usd.html">
            <img src="data:image/png;base64,{{ usd_graph }}" alt="USD Graph">
        </a>
        <img src="data:image/png;base64,{{ linear_graph }}" alt="">
        <a href="eur.html">
            <img src="data:image/png;base64,{{ eur_graph }}" alt="Euro Graph">
        </a>
        <a href="">
            <img src="data:image/png;base64,{{ chf_graph }}" alt="">
        </a>
    </div>

</body>
</html>
